{{ define "main" }}
  <div class="cm-container">
    {{ partial "breadcrumbs.html" . }}
    <header class="cm-page-header">
      <p class="cm-page-kicker">INDEX</p>
      <h1>{{ .Title }}</h1>
      <p>{{ i18n "browseTopics" }}</p>
    </header>
    <div class="cm-term-grid">
      {{ range .Data.Terms.ByCount }}
        <a href="{{ .Page.RelPermalink }}">
          <strong>{{ .Page.LinkTitle }}</strong>
          <span>{{ i18n "articlesCount" .Count }}</span>
        </a>
      {{ else }}
        <p>{{ i18n "noItems" }}</p>
      {{ end }}
    </div>
  </div>
{{ end }}
